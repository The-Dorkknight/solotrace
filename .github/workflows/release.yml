name: release
# Creates a GitHub PRE-release (this project is a work in progress) when a tag like v0.3.4-wip is pushed,
# or when you run it by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (for example v0.3.4-wip). It must already exist, or it will be created on the latest main commit."
        required: true
        default: "v0.3.4-wip"
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Work out the tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then T="${{ github.event.inputs.tag }}"; else T="${GITHUB_REF_NAME}"; fi
          echo "tag=$T" >> "$GITHUB_OUTPUT"
      - name: Pack the source zip (keeps the double-click launchers executable)
        run: |
          git archive --format=zip --prefix=solotrace/ -o "solotrace-${{ steps.tag.outputs.tag }}.zip" HEAD
          sha256sum "solotrace-${{ steps.tag.outputs.tag }}.zip" > SHA256SUMS.txt
      - name: Create the pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          T="${{ steps.tag.outputs.tag }}"
          if gh release view "$T" >/dev/null 2>&1; then
            echo "Release $T already exists; nothing to do."
          else
            gh release create "$T" "solotrace-$T.zip" SHA256SUMS.txt --prerelease --title "SoloTrace $T (work in progress)" \
              --notes "**WORK IN PROGRESS: MANY FEATURES MAY BE BROKEN.** Early pre-release. Unzip, then double-click the launcher for your system (SoloTrace-Linux.sh, SoloTrace-Windows.bat or SoloTrace-Mac.command). Needs Python 3.8+ with tkinter. Not tested on a real Elegoo Phecda yet. See README.md for known limitations." \
              --target "${GITHUB_SHA}"
          fi
